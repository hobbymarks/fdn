[package]
name = "fdn"
version = "0.8.5"
edition = "2021"
authors = ["Marks <ihobbymarks@gmail.com>"]
description = "A tool for uniformly change file or directory names and support rollback these operations"
readme = "README.md"
homepage = "https://github.com/hobbymarks/fdn/"
repository = "https://github.com/hobbymarks/fdn/"
license = "MIT OR Apache-2.0"
keywords = ["file", "directory", "rollback"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
difference = "2.0.0"
directories = "6.0.0"
regex = "1.11.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust-crypto = "0.2.36"
rustc-serialize = "0.3.25"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
unicode-width = "0.2.1"
unicode_names2 = "2.0.0"
walkdir = "2.5.0"
winapi = "0.3.9"

[build-dependencies]
git2 = "0.20.2"

[dev-dependencies]
tempfile = "3.22.0"
