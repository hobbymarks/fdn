version: 2

before:
  hooks:
    - go mod tidy
    - go mod vendor

release:
  prerelease: auto


builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    ignore:
      - goos: darwin
        goarch: '386' # macOS doesn't run on 386

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'


homebrew_casks:
  - name: fdn
    repository:
      owner: hobbymarks
      name: homebrew-hobbymarks
    commit_author:
      name: hobbymarks
      email: ihobbymarks@gmail.com